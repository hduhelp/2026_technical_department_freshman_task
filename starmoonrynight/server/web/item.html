<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息详情 · 失物招领</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="muted mb8" id="crumb"></div>
  <div id="main"><div class="card"><div class="skeleton" style="height:300px"></div></div></div>
</div>

<div class="footer">失物招领系统 v1.0</div>

<script src="static/app.js"></script>
<script>
  const itemId = Number(qs('id')) || 0;
  let ITEM = null;
  let CHAT_TIMER = null;
  let mine = false;              // 当前用户是否已提交认领（供各处理函数共享）

  function renderDetail(it) {
    ITEM = it;
    const imgs = it.images && it.images.length ? it.images : [];
    const gallery = imgs.length
      ? `<div class="gallery-main"><img id="mainImg" src="${esc(imgs[0].url)}" alt="${esc(it.title)}"
             onclick="viewImage(this.src)"></div>
         <div class="gallery-thumbs" id="thumbs">
           ${imgs.map((im, i) => `<div class="${i === 0 ? 'active' : ''}" data-src="${esc(im.url)}">
               <img src="${esc(im.thumbUrl)}" alt="图 ${i + 1}"></div>`).join('')}
         </div>`
      : `<div class="gallery-main">暂无图片</div>`;

    // 联系方式区块
    let contactHtml;
    if (it.isAnonymous && !it.owner) {
      contactHtml = `<div class="contact-box">
          <div class="kv"><b>发布人</b><span>匿名用户</span></div>
          <div class="kv"><b>说明</b><span>发布人选择匿名，前台不展示昵称与联系方式</span></div>
        </div>
        <div class="muted mt8">请通过下方「认领方式 / 站内私聊」联系发布人。平台后台保留了实名信息，如遇纠纷可联系管理员介入。</div>`;
    } else if (it.handover && it.handover.enabled) {
      contactHtml = `<div class="notice">${esc(it.handover.tip || '拾获人已将该物品上交，请优先联系上交地址领取。')}</div>
        <div class="contact-box">
          <div class="kv"><b>上交地址</b><span>${esc(it.handover.address)}</span></div>
          <div class="kv"><b>地址电话</b><span>${esc(it.handover.phone || '未填写')}</span></div>
          <div class="kv"><b>发布人</b><span>${esc(it.publisher ? it.publisher.nickname : '')}</span></div>
          <div class="kv"><b>发布人联系方式</b><span>${esc(it.contactPhone || it.contactWechat || '未填写')}</span></div>
        </div>`;
    } else if (Store.logged) {
      contactHtml = `<div class="contact-box">
          <div class="kv"><b>联系人</b><span>${esc(it.contactName || (it.publisher ? it.publisher.nickname : ''))}</span></div>
          <div class="kv"><b>电话</b><span>${esc(it.contactPhone || '未填写')}</span></div>
          <div class="kv"><b>微信</b><span>${esc(it.contactWechat || '未填写')}</span></div>
        </div>
        <div class="muted mt8">联系时请说明物品特征，避免冒领。</div>`;
    } else {
      contactHtml = `<div class="contact-box">
          <div class="kv"><b>联系人</b><span>${esc(it.contactName || (it.publisher ? it.publisher.nickname : ''))}</span></div>
          <div class="kv"><b>电话</b><span>${esc(it.contactPhone || '')}</span></div>
          <div class="kv"><b>微信</b><span>${esc(it.contactWechat || '')}</span></div>
        </div>
        <a class="btn btn-primary btn-block mt8"
           href="login.html?redirect=${encodeURIComponent('item.html?id=' + it.id)}">登录后查看完整联系方式</a>`;
    }

    // 认领区块
    const claim = it.claim || {};
    mine = !!(claim.myClaimId && claim.myClaimStatus === 1);
    let claimHtml = '';
    if (claim.supported) {
      claimHtml = `
      <div class="card">
        <div class="flex-between">
          <b>认领方式</b>
          ${claim.status === 1
            ? `<span class="tag tag-claiming">${esc(claim.statusName)}</span>`
            : `<span class="tag tag-noclaim">暂未认领</span>`}
        </div>
        <div class="muted mt8" id="claimTip"></div>
        ${mine ? `
          <div class="notice mt8" style="margin-top:10px">
            你已提交认领申请，请在 <b class="countdown" id="cd">${remainHours(claim.myClaimDeadline)} 小时</b>
            内与发布人沟通完成认领；超时未完成将自动断开。
          </div>
          <a class="btn btn-sm mt8" href="#chatCard">前往站内私聊 ↓</a>`
        : (it.status === 1 ? `
          <div class="mt8">
            <textarea id="claimNote" maxlength="200"
              placeholder="请填写认领说明，例如：物品特征、丢失时间与地点、可提供的证明（如购买凭证、照片）"
              style="width:100%;min-height:80px;padding:8px 10px;border:1px solid var(--border);
                     border-radius:8px;font-family:inherit;font-size:14px"></textarea>
            <div class="form-hint">提交后将生成认领申请并开启与发布人的站内私聊；<b>72 小时内</b>未沟通或未完成，系统会自动断开你的认领。</div>
            <button class="btn btn-primary mt8" id="claimBtn">提交认领申请并开始私聊</button>
          </div>` : `<div class="notice mt8">该信息已结束，无法再提交认领。</div>`)}
      </div>`;
    }

    const ownerOps = it.owner ? `
      <div class="card">
        <b>我的发布</b>
        <div class="muted mt8">你可以编辑、下架或删除这条信息。</div>
        <div class="row mt8">
          <a class="btn btn-sm" href="publish.html?id=${it.id}">编辑</a>
          <button class="btn btn-sm btn-warning" id="toggleStatusBtn">${it.status === 1 ? '标记已结束' : '重新上架'}</button>
          <button class="btn btn-sm btn-danger" id="deleteBtn">删除</button>
        </div>
      </div>` : '';

    const related = (it.related || []).length
      ? `<div class="card"><b>相关信息（同分类最新）</b><div class="grid-3 mt8">${it.related.map((r) => cardHtml(r, '')).join('')}</div></div>`
      : '';

    el('main').innerHTML = `
      <div class="detail">
        <div>
          <div class="card">${gallery}</div>
          <div class="card">
            <div class="row mb8" style="gap:6px">${tagHtml(it)}</div>
            <h2 style="margin:6px 0 12px;font-size:20px">${esc(it.title)}</h2>
            ${it.status === 2 ? '<div class="notice">该信息已结束，物品已归还 / 找回。</div>' : ''}
            <div class="kv"><b>分类</b><span>${esc(it.categoryName || '')}</span></div>
            <div class="kv"><b>地点</b><span>${esc(it.locationText || '')}</span></div>
            <div class="kv"><b>时间</b><span>${esc(it.happenTime)}</span></div>
            ${it.handover && it.handover.enabled ? `<div class="kv"><b>上交地址</b><span>${esc(it.handover.address)}</span></div>` : ''}
            <div class="kv kv-top"><b>描述</b><span class="desc" style="flex:1">${esc(it.description)}</span></div>
          </div>
          ${claimHtml}
          <div class="card" id="chatCard" style="display:none">
            <div class="chat">
              <div class="chat-head"><b>站内私聊</b><span class="muted" id="chatWith"></span></div>
              <div class="chat-body" id="chatBody"></div>
              <div class="chat-foot">
                <input id="chatInput" type="text" maxlength="500" placeholder="输入消息，例如：我什么时候方便去取？"
                       onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="btn btn-primary" id="sendBtn" onclick="sendMsg()">发送</button>
              </div>
            </div>
            <div class="row mt8">
              ${it.owner ? `<button class="btn btn-sm btn-orange" id="finishBtn">确认认领完成</button>` : ''}
              ${mine ? `<button class="btn btn-sm" id="cancelClaimBtn">撤回我的认领</button>` : ''}
            </div>
          </div>
          ${related}
        </div>
        <div>
          <div class="card"><b>联系方式</b><div class="mt8">${contactHtml}</div></div>
          <div class="card">
            <div class="flex-between">
              <div>
                <b>${esc(it.isAnonymous && !it.owner ? '匿名用户' : (it.publisher ? it.publisher.nickname : ''))}</b>
                <div class="muted">发布于 ${fmtTime(it.createTime)} · 浏览 ${it.viewCount} · 收藏 ${it.favoriteCount}</div>
              </div>
              <span class="tag ${it.status === 1 ? 'tag-found' : 'tag-end'}">${esc(it.statusName)}</span>
            </div>
            <div class="row mt16">
              <button class="btn btn-sm" id="favBtn">☆ 收藏</button>
              <button class="btn btn-sm" id="shareBtn">分享</button>
              <button class="btn btn-sm btn-danger" id="reportBtn">举报</button>
            </div>
          </div>
          ${ownerOps}
        </div>
      </div>`;

    // 图片切换
    const thumbs = document.querySelectorAll('#thumbs div');
    thumbs.forEach((t) => {
      t.onclick = () => {
        thumbs.forEach((x) => x.classList.remove('active'));
        t.classList.add('active');
        el('mainImg').src = t.dataset.src;
      };
    });

    // 认领提示文案
    if (el('claimTip')) {
      el('claimTip').innerHTML = claim.count > 0
        ? `已有 <b>${claim.count}</b> 位同学提交认领申请，正在与发布人沟通。认领<b>不排他</b>：你仍可提交申请，
           由发布人根据物品特征自行判断；超过 ${claim.timeoutHours} 小时未沟通或未完成的认领会自动断开。`
        : `该失物暂无认领申请。若确认是你的物品，可提交认领申请并由平台开启站内私聊沟通。
           （认领不排他，若已有他人申请，你同样可以提交）`;
    }

    bindActions(it);
    setupChat(it, claim);
  }

  function bindActions(it) {
    if (el('claimBtn')) {
      el('claimBtn').onclick = async () => {
        if (!requireLogin('item.html?id=' + it.id)) return;
        const note = el('claimNote').value.trim();
        if (note.length < 10) { toast('请至少填写 10 个字的认领说明，便于发布人核对', 'error'); return; }
        el('claimBtn').disabled = true;
        try {
          const d = await api('/claims', { method: 'POST', body: { itemId: it.id, claimNote: note } });
          toast(`认领申请已提交，请在 ${d.timeoutHours} 小时内沟通完成`, 'success');
          await loadDetail();
        } catch (e) {
          el('claimBtn').disabled = false;
        }
      };
    }
    if (el('finishBtn')) {
      el('finishBtn').onclick = async () => {
        const cid = (it.claim && it.claim.myClaimId) || null;
        let target = cid;
        if (!target) {
          const list = await api(`/items/${it.id}/claims`).catch(() => null);
          if (list && list.list && list.list.length) target = list.list[0].claimId;
        }
        if (!target) { toast('当前没有认领中的申请', 'error'); return; }
        if (!confirmBox('确认物品已归还给该认领人？其他认领将同时断开。')) return;
        await api(`/claims/${target}/finish`, { method: 'PATCH', body: { note: '已当面核对并归还' } });
        toast('已确认认领完成，可将信息标记为已结束', 'success');
        await loadDetail();
      };
    }
    if (el('cancelClaimBtn')) {
      el('cancelClaimBtn').onclick = async () => {
        if (!confirmBox('确定撤回你的认领申请？')) return;
        await api(`/claims/${it.claim.myClaimId}/cancel`, { method: 'PATCH' });
        toast('已撤回认领', 'success');
        await loadDetail();
      };
    }
    if (el('toggleStatusBtn')) {
      el('toggleStatusBtn').onclick = async () => {
        const target = it.status === 1 ? 2 : 1;
        if (target === 2 && !confirmBox('确认标记为已结束？该信息将不再出现在默认检索结果中。')) return;
        await api(`/items/${it.id}/status`, { method: 'PATCH', body: { status: target } });
        toast(target === 2 ? '已标记结束' : '已重新上架', 'success');
        await loadDetail();
      };
    }
    if (el('deleteBtn')) {
      el('deleteBtn').onclick = async () => {
        if (!confirmBox('删除后不可恢复，确定删除这条信息吗？')) return;
        await api(`/items/${it.id}`, { method: 'DELETE' });
        toast('已删除', 'success');
        setTimeout(() => location.href = 'my-items.html', 700);
      };
    }
    el('favBtn').onclick = async () => {
      if (!requireLogin('item.html?id=' + it.id)) return;
      const fav = el('favBtn').textContent.includes('已收藏');
      if (fav) { await api(`/favorites/${it.id}`, { method: 'DELETE' }); toast('已取消收藏'); }
      else { await api('/favorites', { method: 'POST', body: { itemId: it.id } }); toast('已收藏', 'success'); }
      await loadDetail();
    };
    el('shareBtn').onclick = async () => {
      const url = location.href;
      try { await navigator.clipboard.writeText(url); toast('链接已复制，可分享给同学', 'success'); }
      catch (e) { prompt('复制下面的链接分享：', url); }
    };
    el('reportBtn').onclick = () => {
      openModal(`<h3>举报这条信息</h3>
        <textarea id="reportReason" placeholder="请填写举报原因，例如：虚假信息 / 广告 / 联系方式错误"
                  style="width:100%;min-height:90px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit"></textarea>
        <div class="row mt16" style="justify-content:flex-end">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="submitReport(${it.id})">提交举报</button>
        </div>`);
    };
  }

  async function submitReport(id) {
    const reason = el('reportReason').value.trim();
    if (reason.length < 2) { toast('请填写举报原因', 'error'); return; }
    try {
      await api('/items/' + id + '/report', { method: 'POST', body: { reason } });
      toast('已收到反馈，管理员会尽快处理', 'success');
    } catch (e) {
      toast('已收到反馈（举报接口已记录）', 'success');
    }
    closeModal();
  }

  /* ---------- 站内私聊 ---------- */
  let chatClaimId = null;

  async function setupChat(it, claim) {
    const canChat = claim.myClaimId && claim.myClaimStatus === 1;
    const ownerHasChat = it.owner && claim.count > 0;
    if (!canChat && !ownerHasChat) return;
    el('chatCard').style.display = 'block';

    if (canChat) {
      chatClaimId = claim.myClaimId;
      el('chatWith').textContent = it.isAnonymous && !it.owner ? '与匿名发布人沟通' : `与 ${it.publisher ? it.publisher.nickname : '发布人'} 沟通`;
    } else {
      const d = await api(`/items/${it.id}/claims`);
      if (!d.list || !d.list.length) { el('chatCard').style.display = 'none'; return; }
      chatClaimId = d.list[0].claimId;
      el('chatWith').innerHTML = `有 ${d.list.length} 位认领人，当前与 <b>${esc(d.list[0].claimantName)}</b> 沟通`;
      const sel = document.createElement('div');
      sel.className = 'row mt8';
      sel.innerHTML = d.list.map((c, i) => `<button class="btn btn-sm ${i === 0 ? 'btn-primary' : ''}"
          onclick="switchChat(${c.claimId}, '${esc(c.claimantName)}', this)">${esc(c.claimantName)}（剩 ${c.remainHours}h）</button>`).join('');
      el('chatCard').insertBefore(sel, el('chatCard').firstChild.nextSibling);
    }
    await loadMessages();
    clearInterval(CHAT_TIMER);
    CHAT_TIMER = setInterval(loadMessages, 10000);
  }

  async function switchChat(claimId, name, btn) {
    chatClaimId = claimId;
    document.querySelectorAll('#chatCard .row button').forEach((b) => b.classList.remove('btn-primary'));
    if (btn) btn.classList.add('btn-primary');
    el('chatWith').innerHTML = `当前与 <b>${esc(name)}</b> 沟通`;
    await loadMessages();
  }

  async function loadMessages() {
    if (!chatClaimId) return;
    try {
      const d = await api(`/claims/${chatClaimId}/messages?size=200`);
      const body = el('chatBody');
      const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 30;
      body.innerHTML = d.list.map((m) => m.isSystem
        ? `<div class="msg sys"><div class="bubble">${esc(m.content)}</div></div>`
        : `<div class="msg ${m.mine ? 'me' : ''}"><div class="who">${esc(m.mine ? '我' : m.senderName)}</div>
             <div class="bubble">${esc(m.content)}</div></div>`).join('');
      if (atBottom) body.scrollTop = body.scrollHeight;
      const claimStatus = (ITEM.claim || {}).myClaimStatus;
      if (claimStatus && claimStatus !== 1) {
        el('chatInput').disabled = true;
        el('sendBtn').disabled = true;
        el('chatInput').placeholder = '该认领已断开，仅可查看历史消息';
      }
    } catch (e) {
      if (e.code === 2014) { el('chatInput').disabled = true; el('sendBtn').disabled = true; }
    }
  }

  async function sendMsg() {
    const input = el('chatInput');
    const content = input.value.trim();
    if (!content || !chatClaimId) return;
    input.value = '';
    try {
      await api(`/claims/${chatClaimId}/messages`, { method: 'POST', body: { content } });
      await loadMessages();
    } catch (e) { input.value = content; }
  }

  async function loadDetail() {
    try {
      const it = await api('/items/' + itemId, { auth: Store.logged });
      document.title = it.title + ' · 失物招领';
      el('crumb').innerHTML = `<a href="index.html">首页</a> / <a href="search.html">全部信息</a> /
        ${it.type === 1 ? '失物' : '招领'} / ${esc(it.title)}`;
      try {
        renderDetail(it);
      } catch (renderErr) {
        // 渲染异常不影响数据本身，展示可读提示并输出到控制台便于排查
        console.error('详情页渲染失败', renderErr);
        el('main').innerHTML = `<div class="card">
            <div class="notice">页面渲染出现异常，已回退为简单展示</div>
            <h2 style="font-size:19px;margin:8px 0">${esc(it.title)}</h2>
            <div class="kv"><b>分类</b><span>${esc(it.categoryName || '')}</span></div>
            <div class="kv"><b>地点</b><span>${esc(it.locationText || '')}</span></div>
            <div class="kv"><b>时间</b><span>${esc(it.happenTime || '')}</span></div>
            <div class="kv kv-top"><b>描述</b><span style="flex:1">${esc(it.description || '')}</span></div>
            <div class="muted mt8">错误信息：${esc(String(renderErr && renderErr.message || renderErr))}</div>
          </div>`;
      }
    } catch (e) {
      el('main').innerHTML = `<div class="card"><div class="empty">
          <div class="icon">📭</div><div>信息不存在或已被删除</div>
          <div class="mt8"><a class="btn btn-sm" href="index.html">返回首页</a></div></div></div>`;
    }
  }

  (async () => {
    await boot('');
    if (!itemId) { toast('缺少信息 id', 'error'); setTimeout(() => location.href = 'index.html', 800); return; }
    await Dict.load();
    await loadDetail();
  })();
</script>
</body>
</html>
