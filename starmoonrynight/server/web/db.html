<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据库管理台 · 失物招领</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="page-title">数据库管理台 <span class="muted" style="font-size:13px;font-weight:400">SQLite · 仅管理员可见</span></div>

  <div class="grid-2 db-layout">
    <!-- 表列表 -->
    <div class="card" style="padding:12px">
      <div class="db-table-list" id="tableList"></div>
      <div class="muted mt8" id="dbInfo" style="font-size:12px;line-height:1.8"></div>
    </div>

    <div>
      <!-- 表数据 -->
      <div class="card" id="tableCard">
        <div class="flex-between mb8">
          <b id="tableTitle">请选择左侧的表</b>
          <div class="row">
            <input type="text" id="rowKw" placeholder="关键词搜索" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px">
            <button class="btn btn-sm" onclick="loadRows(1)">搜索</button>
            <button class="btn btn-sm btn-orange" id="addRowBtn" onclick="openRowModal()" style="display:none">＋ 新增记录</button>
            <button class="btn btn-sm" id="exportBtn" onclick="exportTable()" style="display:none">导出 CSV</button>
          </div>
        </div>
        <div class="table-wrap" style="max-height:60vh;overflow:auto">
          <table id="dataTable" style="font-size:12.5px"></table>
        </div>
        <div id="rowPager"></div>
      </div>

      <!-- SQL 控制台 -->
      <div class="card">
        <div class="flex-between mb8">
          <b>SQL 控制台</b>
          <div class="row">
            <label class="muted"><input type="checkbox" id="allowWrite"> 允许写入（INSERT/UPDATE/DELETE/ALTER）</label>
            <button class="btn btn-sm btn-orange" onclick="runSql()">执行</button>
          </div>
        </div>
        <textarea id="sqlBox" style="width:100%;min-height:90px;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:Consolas,monospace;font-size:13px"
          placeholder="示例：SELECT id, title, status FROM item_record ORDER BY id DESC LIMIT 20"></textarea>
        <div class="row mt8">
          <span class="muted">一次仅允许执行一条语句；写操作需勾选「允许写入」并会被记入操作日志。</span>
        </div>
        <div id="sqlResult" class="mt8"></div>
        <div class="row mt8">
          <button class="btn btn-sm" onclick="el('sqlBox').value='SELECT * FROM item_record ORDER BY id DESC LIMIT 20';runSql()">查信息</button>
          <button class="btn btn-sm" onclick="el('sqlBox').value='SELECT * FROM item_claim ORDER BY id DESC LIMIT 20';runSql()">查认领</button>
          <button class="btn btn-sm" onclick="el('sqlBox').value='SELECT * FROM claim_message ORDER BY id DESC LIMIT 30';runSql()">查私聊</button>
          <button class="btn btn-sm" onclick="el('sqlBox').value='SELECT * FROM sys_operation_log ORDER BY id DESC LIMIT 30';runSql()">查操作日志</button>
          <button class="btn btn-sm" onclick="el('sqlBox').value='SELECT type, status, claim_status, COUNT(*) AS cnt FROM item_record WHERE deleted = 0 GROUP BY type, status, claim_status';runSql()">统计汇总</button>
        </div>
      </div>

      <!-- 备份与维护 -->
      <div class="grid-2">
        <div class="card">
          <b>备份与维护</b>
          <div class="row mt8">
            <button class="btn btn-sm btn-orange" onclick="doBackup()">立即备份数据库</button>
            <button class="btn btn-sm" onclick="loadBackups()">刷新备份列表</button>
            <button class="btn btn-sm" onclick="checkHealth()">健康检查</button>
          </div>
          <div class="mt8" id="backupList"></div>
        </div>
        <div class="card">
          <b>表结构</b>
          <div class="mt8" id="schemaList" style="max-height:260px;overflow:auto"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">失物招领系统 v1.0 · 数据库文件：server/data/lostfound.db</div>

<script src="static/app.js"></script>
<script>
  let currentTable = '';
  let currentPk = 'id';
  let currentColumns = [];
  let currentPage = 1;
  let tableMeta = [];

  async function loadTables() {
    const d = await api('/admin/db/tables');
    tableMeta = d.tables;
    el('tableList').innerHTML = d.tables.map((t) => `
      <a href="#" data-table="${t.name}" class="${t.name === currentTable ? 'active' : ''}">
        <span>${esc(t.label)}</span><span>${t.rows}</span>
      </a>`).join('');
    const info = d.info;
    el('dbInfo').innerHTML = `SQLite ${info.sqliteVersion}<br>日志模式：${info.journalMode}<br>
      文件大小：${info.dbSizeKb} KB<br><span style="word-break:break-all">${esc(info.dbFile)}</span>`;
    document.querySelectorAll('#tableList a').forEach((a) => {
      a.onclick = (e) => { e.preventDefault(); selectTable(a.dataset.table); };
    });
  }

  function selectTable(name) {
    currentTable = name;
    currentPage = 1;
    document.querySelectorAll('#tableList a').forEach((a) => a.classList.toggle('active', a.dataset.table === name));
    el('tableTitle').textContent = name;
    el('addRowBtn').style.display = 'inline-flex';
    el('exportBtn').style.display = 'inline-flex';
    loadRows(1);
  }

  async function loadRows(page) {
    if (!currentTable) return;
    currentPage = page || currentPage;
    const p = new URLSearchParams({ page: currentPage, size: 30 });
    if (el('rowKw').value.trim()) p.set('keyword', el('rowKw').value.trim());
    const d = await api(`/admin/db/tables/${currentTable}?` + p.toString());
    currentPk = d.pk;
    currentColumns = d.columns;
    const cols = d.columns.map((c) => c.name);
    const cell = (v) => {
      if (v === null || v === undefined) return '';
      const s = String(v).replace(/\s+/g, ' ');
      return s.length > 42
        ? `<span title="${esc(s)}">${esc(s.slice(0, 42))}…</span>`
        : esc(s);
    };
    el('dataTable').innerHTML = `
      <thead><tr>${cols.map((c) => `<th style="white-space:nowrap">${esc(c)}</th>`).join('')}<th>操作</th></tr></thead>
      <tbody>${d.list.map((row) => `
        <tr>
          ${cols.map((c) => `<td style="max-width:300px">${cell(row[c])}</td>`).join('')}
          <td style="white-space:nowrap">
            <button class="btn btn-sm" onclick='openRowModal(${JSON.stringify(row).replace(/'/g, "&#39;")})'>编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteRow('${esc(String(row[d.pk]))}')">删除</button>
          </td>
        </tr>`).join('') || `<tr><td colspan="${cols.length + 1}" class="muted">表中暂无数据</td></tr>`}
      </tbody>`;
    el('rowPager').innerHTML = pagerHtml(d.page, d.pages, 'loadRows');
  }

  function openRowModal(row) {
    const isNew = !row;
    const fields = currentColumns.filter((c) => !(isNew && c.pk));
    openModal(`<h3>${isNew ? '新增' : '编辑'}记录 · ${esc(currentTable)}</h3>
      ${fields.map((c) => `
        <div class="form-row" style="padding:5px 0">
          <div class="form-label" style="width:150px">${esc(c.name)}
            <div class="muted" style="font-size:11px">${esc(c.type || '')}${c.pk ? ' · 主键' : ''}</div>
          </div>
          <div class="form-ctrl">
            <input type="text" data-col="${esc(c.name)}" ${c.pk && !isNew ? 'disabled' : ''}
                   value="${row && row[c.name] !== null && row[c.name] !== undefined ? esc(String(row[c.name])) : ''}">
          </div>
        </div>`).join('')}
      <div class="muted mt8">直接修改字段值即可；留空表示写入 NULL（新增时留空的字段会被忽略，由数据库默认值填充）。</div>
      <div class="row mt16" style="justify-content:flex-end">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveRow(${isNew ? 'null' : `'${esc(String(row[currentPk]))}'`})">保存</button>
      </div>`);
  }

  function collectRowValues() {
    const values = {};
    document.querySelectorAll('.modal input[data-col]').forEach((i) => {
      if (i.disabled) return;
      values[i.dataset.col] = i.value === '' ? null : i.value;
    });
    return values;
  }

  async function saveRow(rowId) {
    const values = collectRowValues();
    if (rowId) {
      await api(`/admin/db/tables/${currentTable}/${encodeURIComponent(rowId)}`, { method: 'PUT', body: { values } });
      toast('已更新该行记录', 'success');
    } else {
      await api(`/admin/db/tables/${currentTable}`, { method: 'POST', body: { values } });
      toast('已新增记录', 'success');
    }
    closeModal();
    loadRows(currentPage);
    loadTables();
  }

  async function deleteRow(rowId) {
    if (!confirmBox('确定删除这条记录？该操作不可恢复（建议先备份）。')) return;
    await api(`/admin/db/tables/${currentTable}/${encodeURIComponent(rowId)}`, { method: 'DELETE' });
    toast('已删除', 'success');
    loadRows(currentPage);
    loadTables();
  }

  function exportTable() {
    if (!currentTable) return;
    const token = Store.access;
    fetch(`/api/v1/admin/db/export/${currentTable}`, { headers: { Authorization: 'Bearer ' + token } })
      .then((r) => r.blob())
      .then((b) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = currentTable + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      });
  }

  async function runSql() {
    const sql = el('sqlBox').value.trim();
    if (!sql) { toast('请输入 SQL', 'error'); return; }
    try {
      const d = await api('/admin/db/query', {
        method: 'POST',
        body: { sql, allowWrite: el('allowWrite').checked, confirmDrop: false },
      });
      if (!d.columns.length) {
        el('sqlResult').innerHTML = `<div class="notice notice-ok">执行成功，影响 ${d.affected} 行，耗时 ${d.costMs} ms</div>`;
      } else {
        el('sqlResult').innerHTML = `
          <div class="muted">返回 ${d.rowCount} 行，耗时 ${d.costMs} ms${d.rowCount > 200 ? '（仅显示前 200 行）' : ''}</div>
          <div class="table-wrap mt8"><table>
            <thead><tr>${d.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${d.rows.map((r) => `<tr>${d.columns.map((c) => `<td>${esc(r[c] === null ? '' : r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div>`;
      }
      loadTables();
    } catch (e) { /* 提示已处理 */ }
  }

  async function doBackup() {
    const d = await api('/admin/db/backup', { method: 'POST' });
    toast(`已备份：${d.file}（${d.sizeKb} KB）`, 'success');
    loadBackups();
  }

  async function loadBackups() {
    const d = await api('/admin/db/backups');
    el('backupList').innerHTML = d.list.length
      ? d.list.map((b) => `<div class="list-line"><span>${esc(b.file)}</span>
          <span class="muted" style="margin-left:auto">${b.sizeKb} KB · ${esc(b.time)}</span></div>`).join('')
      : '<div class="muted">还没有备份文件</div>';
  }

  async function checkHealth() {
    const d = await api('/admin/db/health');
    openModal(`<h3>数据库健康检查</h3>
      <div class="kv"><b>完整性</b><span>${esc(d.integrity)}</span></div>
      <div class="kv"><b>表数量</b><span>${d.tableCount}</span></div>
      <div class="kv"><b>WAL 大小</b><span>${d.walSize === null ? '—' : d.walSize + ' KB'}</span></div>
      <div class="row mt16" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">关闭</button></div>`);
  }

  async function loadSchema() {
    const d = await api('/admin/db/schema');
    el('schemaList').innerHTML = d.list.map((s) => `
      <details style="margin-bottom:6px">
        <summary style="cursor:pointer;font-size:13.5px">${esc(s.name)}</summary>
        <div class="code">${esc(s.sql || '')}</div>
      </details>`).join('');
  }

  (async () => {
    await boot('');
    if (!Store.logged || Store.user.role !== 2) {
      location.href = 'login.html?redirect=db.html';
      return;
    }
    await loadTables();
    await loadBackups();
    await loadSchema();
    selectTable('item_record');
  })();
</script>
</body>
</html>
