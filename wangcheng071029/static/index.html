<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杭电失物招领</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><p class="eyebrow">HDU</p><h1>失物招领</h1></div><div id="account"><button onclick="showAuth('login')">登录</button><button class="primary" onclick="showAuth('register')">注册</button></div></header><main><section class="hero"><p>校园里的每一次遗失，都值得被认真寻找。</p><div class="filters"><input id="q" placeholder="搜索物品、地点或描述"><select id="type"><option value="">全部类型</option><option value="lost">失物寻找</option><option value="found">招领信息</option></select><select id="status"><option value="">全部状态</option><option value="searching">寻找中</option><option value="found">已找到</option><option value="closed">已结束</option></select><button class="primary" onclick="loadPosts(1)">搜索</button></div></section><section id="publish" class="panel hidden"><div class="section-title"><h2 id="publishTitle">发布信息</h2><span>请填写真实、准确的内容</span></div><form id="postForm"><select name="type"><option value="lost">我丢失了物品</option><option value="found">我捡到了物品</option></select><input name="item_name" placeholder="物品名称" required><input name="location" placeholder="地点" required><input name="happened_at" type="datetime-local"><select name="contact_method"><option>微信</option><option>QQ</option><option>手机号</option></select><input name="contact_value" placeholder="填写号码或账号" required><textarea name="description" placeholder="描述物品特征" required></textarea><button class="primary" id="postSubmit">发布信息</button></form></section><section class="section-title"><h2>最新信息</h2><span id="count"></span></section><section id="posts" class="grid"></section><nav id="pager"></nav></main><dialog id="auth"><form method="dialog" id="authForm"><button type="button" class="close" aria-label="关闭" onclick="auth.close()">×</button><h2 id="authTitle">登录</h2><label>用户名<input name="username" placeholder="请输入用户名" required></label><label>密码<input name="password" type="password" placeholder="请输入密码" required></label><button class="primary" id="authSubmit">登录</button><p id="authHint"></p></form></dialog><template id="card"><article class="card"><div class="card-top"><span class="pill"></span><time></time></div><h3></h3><p class="location"></p><p class="description"></p><div class="card-bottom"><span class="contact"></span><span class="actions"></span></div></article></template><script src="/static/app.js?v=20261007-3"></script></body></html>
