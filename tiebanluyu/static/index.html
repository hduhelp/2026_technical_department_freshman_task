<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>杭电失物招领 · 让丢失的东西回家</title>
    <meta
      name="description"
      content="杭电校园失物招领平台：发布寻物启事和招领启事，支持搜索、状态标记和智能匹配。"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <!-- ==================== 顶部导航 ==================== -->
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">🔍</span>
          <span class="brand-text">
            <strong>杭电失物招领</strong>
            <small>让丢失的东西回家</small>
          </span>
        </a>

        <!--
          导航区只保留「我的发布」。
          「全部 / 寻物启事 / 招领启事」这类**筛选**功能统一交给页面里的
          chip 行去做，避免同一个筛选状态有两套控件（那样必然有一方
          的高亮状态跟不上，实测就是这样）。
        -->
        <nav class="main-nav" id="mainNav">
          <a class="nav-item nav-item-mine" data-nav="mine" href="#/mine" hidden>我的发布</a>
        </nav>

        <div class="header-actions" id="headerActions">
          <!-- 由 JS 根据登录状态渲染 -->
        </div>

        <button class="nav-toggle" id="navToggle" aria-label="展开菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- ==================== 主体内容（由 JS 渲染） ==================== -->
    <main id="app" class="container app-main">
      <div class="loading-block">
        <div class="spinner"></div>
        <p>正在加载…</p>
      </div>
    </main>

    <!-- ==================== 页脚 ==================== -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-main">
          杭电校园失物招领系统 ·
          <a href="/docs" target="_blank" rel="noopener">接口文档</a> ·
          <a href="/redoc" target="_blank" rel="noopener">ReDoc</a>
        </p>
        <p class="footer-sub">
          2026 杭电助手技术部招新任务 · 开发赛道作品 ·
          找到东西后记得把状态改成「已找到」，别让其他同学白帮忙
        </p>
      </div>
    </footer>

    <!-- ==================== 发布按钮（悬浮） ==================== -->
    <button class="fab" id="fabCreate" title="发布信息">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" />
      </svg>
      <span>发布</span>
    </button>

    <!-- ==================== 提示条容器 ==================== -->
    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <!-- ==================== 确认弹窗 ==================== -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle" class="modal-title">确认操作</h3>
        <p class="modal-text" id="modalText"></p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modalCancel">取消</button>
          <button class="btn btn-danger" id="modalConfirm">确认</button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
