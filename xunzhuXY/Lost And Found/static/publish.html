<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>失物发布</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="form-page">
    <h3>发布</h3>
    <div>
        <input id="type" class="input" placeholder="丢失或招领">
    </div>
    <div>
        <input id="title" class="input" placeholder="物品类型">
    </div>
    <div>
        <input id="place" class="input" placeholder="地点">
    </div>
    <div>
        <input id="happened-at" class="input" placeholder="发现时间">
    </div>
    <div>
        <input id="description" class="input" placeholder="描述">
    </div>
    <div>
        <input id="contact-info" class="input" placeholder="联系方式">
    </div>
    <div>
        <input type="file" id="image" accept="image/*">
        <img id="preview" alt="" style="display:none;">   <!-- ★ 选图后本地预览 -->
    </div>
    <button class="btn" onclick="post()">发布</button>
    <pre id="out"></pre>

    <footer>
        <button class="btn ghost" onclick="backToIndex()">返回主界面</button>
        <button class="btn ghost" onclick="backToManage()">返回管理界面</button>
    </footer>
  </div>


    <script>
        /* ★★ 选中图片后立刻本地预览（★ 要放在【函数外面】——
              放在 post() 里的话，得点"发布"才生效 ✓）*/
        document.getElementById("image").addEventListener("change", function () {
            const f = this.files[0];
            const img = document.getElementById("preview");

            if (!f) { img.style.display = "none"; return; }

            // ★ 后端限制 5MB —— 提前在前端拦一下，用户不用等上传失败
            if (f.size > 5 * 1024 * 1024) {
                alert("图片不能超过 5MB");
                this.value = "";                     // 清空选择
                img.style.display = "none";
                return;
            }

            // ★★ URL.createObjectURL：给文件对象造一个临时本地地址
            //    不用上传、不用 base64，大图也不卡 ✓
            if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);  // 释放上一个
            const url = URL.createObjectURL(f);
            img.dataset.url = url;
            img.src = url;
            img.style.display = "block";
        });

        async function post() {
            const token = localStorage.getItem("token");
            const out = document.getElementById("out");
            
            if (!token) {
                alert("请先登录");
                window.location.href = "/static/login.html";
                return; 
            }
            out.textContent = "发布中...";
            try{
                const filename = await uploadImage();
                const res = await fetch("/items", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token,
                    },
                    body: JSON.stringify({
                        type: document.getElementById("type").value,
                        title: document.getElementById("title").value,
                        place:document.getElementById("place").value,
                        happened_at:document.getElementById("happened-at").value,
                        description:document.getElementById("description").value,
                        contact_info:document.getElementById("contact-info").value,
                        image:filename,
                    }),
                });
                const data = await res.json();

                if (!res.ok) {                                     // ★ 失败也要说话
                    out.textContent = "发布失败：" + (data.msg || res.status);
                    return;
                }
                out.textContent = "发布成功 ✓\n" + JSON.stringify(data, null, 2);

                alert("正在为您匹配相应的帖子，请您在点击确定后耐心等待一下");

                try {
                    const matchRes = await fetch("/items/" + data.data.item_id + "/match", {
                        method: "POST",
                        headers: { "Authorization": "Bearer " + token },
                    });
                    if (matchRes.ok) {
                        const md = await matchRes.json();
                        const list = md.result || [];
                        if (list.length > 0) {
                            const lines = list.slice(0, 3).map(r =>          // ★ 只取 3 条
                                "· 帖号 " + r.item_id + "：" +
                                (r.verdict === "same" ? "很可能是同一件" : "可能相关") + "\n  " + r.reason
                            ).join("\n");
                            alert("★ 似乎有人发布了相关帖子：\n\n" + lines + "\n\n（可在首页搜索查看详情）");
                        }else{
                            alert("暂时没找到相关帖子");
                        }
                        // ★ 没匹配 → 什么都不做（静默 ✓）
                    }
                } catch (e) {
                    console.error("匹配请求失败:", e);      // ★ 只在控制台留记录，不打扰用户
                }

            } catch (e){
                out.textContent = "请求失败：" + e.message;
            }
        }

        async function uploadImage() {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("请先登录");
                window.location.href = "/static/login.html";
                return; 
            }
            const f = document.getElementById("image").files[0];
            if (!f) return "";

            const fd = new FormData();
            fd.append("file", f);                     // ★ 字段名要和后端一致

            const res = await fetch("/upload", {
                method:"POST",
                headers: { "Authorization": "Bearer " + token },
                body: fd,
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.msg || res.status);
            return data.data.filename;                // 拿文件名去发帖 ✓
        }

        function backToIndex(){
            window.location.href = "/static/index.html";
        }
        function backToManage(){
            window.location.href = "/static/manage.html";
        }
    </script>
</body>
</html>
