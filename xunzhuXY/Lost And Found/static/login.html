<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录界面</title>
    <style>
        *{box-sizing: border-box;}
        body {margin:0;font-family:"Microsoft YaHei", "微软雅黑", sans-serif;text-align: center;padding: 0;background: #f5f5f5;}
        div {margin-bottom: 10px;}
    </style>
</head>
<body>
    <h3>登录</h3>
    <div><input id="u" placeholder="用户名"></div>
    <div><input id="p" placeholder="密码"></div>
    <div><button onclick="login()">登录</button></div>
    <div><pre id="out"></pre></div>

    <footer>
        <div><a href="/static/reg.html" style="color: #2b6cb0; text-decoration: none; font-size: 14px;">没有账号，在这里注册</a></div>
        <div><button onclick="back()">返回主菜单</button></div>
    </footer>

    <script>
        async function login() {
            const out = document.getElementById("out");
            out.textContent = "登录中...";
            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("u").value,
                        password: document.getElementById("p").value,
                    }),
                });
                const data = await res.json();

                if (!res.ok) {                                     // ★ 失败也要说话
                    out.textContent = "登录失败：" + (data.msg || res.status);
                    return;
                }
                localStorage.setItem("token", data.token);
                localStorage.setItem("name" , document.getElementById("u").value);
                alert("登录成功 ✓\ntoken: " + data.token.slice(0, 24) + "...");
                window.location.href = "/static/index.html";
                // ★ 显示 token 前 24 位 —— 你就知道"确实存到了、而且是这个"✓✓
            } catch (e) {
                out.textContent = "请求失败：" + e.message;
            }
        }
        //document.getElementById("out").textContent = res.status + "\n" + JSON.stringify(await res.json(),null,2);
        function back(){
            window.location.href = "/static/index.html"
        }
    </script>
</body>
</html>
