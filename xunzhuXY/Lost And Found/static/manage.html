<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理界面</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 760px;
          margin: 0 auto; padding: 16px; background: #f5f5f5; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 20px; margin: 0; }
        #auth { font-size: 14px; color: #666; }
        .back {margin:10px}
        a { color: #2b6cb0; text-decoration: none; font-size: 14px; }

        
        .filters { margin: 16px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        input, select, button { padding: 6px 10px; font-size: 14px; border: 1px solid #ccc;
                            border-radius: 6px; background: #fff; }
        button:hover,input:hover,select:hover {cursor: pointer;}
        button:disabled { color: #aaa; cursor: not-allowed; }
        ul { list-style: none; padding: 0; }
        .card { background: #fff; border-radius: 10px; padding: 12px 14px;
                margin-bottom: 10px; display: flex; justify-content: space-between;
                align-items: center; gap: 12px; flex-wrap: wrap;}
        .detail { width: 100%; background-color: #fff;padding: 5px 5px;} 
        .title { font-size: 16px; cursor: pointer; }
        .open:hover,.del:hover,.edit:hover {background-color: #ddd;}
        .meta { font-size: 12.5px; color: #888; margin-top: 6px; }
        #pager { margin: 16px 0; font-size: 14px; }
        #out { color: #c53030; font-size: 14px; white-space: pre-wrap; }

        .small-image {width:60px;height:60px;object-fit:cover;border-radius:6px;}
        .big-image {width:500px;height:500px;object-fit:contain;border-radius:20px;}
    </style>
</head>
<body>
    <header>
        <h1>用户管理</h1>
        <div id="auth"></div>
    </header>

    <section class="filters">
        <select id="type">
            <option value="">全部类型</option>
            <option value="丢失">丢失</option>
            <option value="招领">招领</option>
        </select>
        <input id="keyword" placeholder="搜索物品名 / 描述" style="flex:1; min-width:160px;">
        <select id="order">
            <option value="desc">最新在前</option>
            <option value="asc">最早在前</option>
        </select>
        <button onclick="load(1)">搜索</button>
        <a href="/static/publish.html">+ 发布</a>
    </section>
        
    <ul id="list"></ul>
    <div id="pager"></div>
    <pre id="out"></pre>

    <script>
        const $ = (id) => document.getElementById(id); //化繁为简
        const SIZE = 10;
        const token = localStorage.getItem("token");
        const username  = localStorage.getItem("name");
        let page = 1;

        // ★ 后端存的是英文，显示时换成中文（"存储用英文、显示用中文"）
        const STATUS_TEXT = { searching: "寻找中", found: "已找到", closed: "已结束" };

        function ready(){
            const box = $("auth");
            const name = document.createElement("span");
            const back = document.createElement("button");
            const getUser = document.createElement("button");
            name.textContent = username;
            back.textContent = "返回主界面";
            back.onclick = () => {window.location.href = "/static/index.html";};
            back.classList.add("back");
            getUser.textContent = "用户信息";
            getUser.onclick = () => _getUser();
            getUser.classList.add("getUser");
            box.append(name,getUser,back);
        }
        

        /* ---------- 拉列表 ---------- */
        async function load(p) {
            page = p;
            const out = $("out");
            out.textContent = "";

            const qs = new URLSearchParams();            // ★ 自动做 URL 编码（中文关键词也安全）
            if ($("type").value)         qs.set("type", $("type").value);
            if ($("keyword").value.trim()) qs.set("keyword", $("keyword").value.trim());
            qs.set("order", $("order").value);
            qs.set("page", page);
            qs.set("size", SIZE);

            try { 
                const res  = await fetch("/my/items?" + qs.toString(),{
                    method:"GET",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token,
                    },
                }); //会变成: /items?type=..&keyword=..&order=..&...
                const data = await res.json();
                if (!res.ok) { out.textContent = "加载失败：" + (data.msg || res.status); return; }
                renderList(data.data);
                renderPager(data.total, data.page, data.size);
            } catch (e) {
                out.textContent = "请求失败：" + e.message;
            }
        }

        /* ---------- 画列表（全程 textContent，不用 innerHTML） ---------- */
        function renderList(items) {
            const list = $("list");
            list.textContent = "";

            //没有找到帖子
            if (!items || items.length === 0) {
                const li = document.createElement("li");
                li.textContent = "没有找到相关帖子";
                list.appendChild(li);
                return;
            }

            for (const it of items) {
                const li = document.createElement("li");

                //添加详情页
                const detail = document.createElement("div");
                detail.className = "detail";
                detail.style.display = "none";
                

                li.className = "card";
                //li.onclick = () => toggleDetail(detail,it.item_id);

                const left = document.createElement("div");

                const title = document.createElement("div");
                title.className = "title";
                title.textContent = "[" + it.type + "] " + it.title;   // ★ 安全
                //title.onclick = () => toggleDetail(detail,it.item_id);

                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = it.place + " · " +
                                (STATUS_TEXT[it.status] || it.status) + " · " + it.created_at;

                left.append(title, meta);

                //展开按钮
                const btn = document.createElement("button");
                btn.className = "open";
                btn.textContent = "展开";
                btn.onclick = () => toggleDetail(detail,it.item_id);
                //btn.onclick = () => del(it.item_id);

                //编辑按钮
                const edit = document.createElement("button");
                edit.className = "edit";
                edit.textContent = "编辑"
                edit.onclick = () => {localStorage.setItem("itemId",it.item_id);window.location.href = "/static/edit.html"}
                
                //删除按钮
                const del = document.createElement("button");
                del.className = "del";
                del.textContent = "删除";
                del.onclick = () => _del(it.item_id);

                //console.log(it.image)
                if(it.image){
                    const img = document.createElement("img");
                    img.classList.add("small-image");
                    img.src = "/uploads/" + it.image;
                    img.onerror = () => { img.style.display = "none"; };   // ★ 加载失败就不显示（防破图 ✓）
                    left.appendChild(img);
                }

                li.append(left, edit, del, btn);
                li.appendChild(detail);
                list.appendChild(li);
            }
        }

        /* ---------- 分页条 ---------- */
        function renderPager(total, cur, size) {
            const pager = $("pager"); 
            pager.textContent = "";
            const pages = Math.max(1, Math.ceil(total / size));

            const prev = document.createElement("button");
            prev.textContent = "上一页";
            prev.disabled = cur <= 1;
            prev.onclick = () => load(cur - 1);

            const info = document.createElement("span");
            info.textContent = " 第 " + cur + " / " + pages + " 页（共 " + total + " 条） ";

            const next = document.createElement("button");
            next.textContent = "下一页";
            next.disabled = cur >= pages;
            next.onclick = () => load(cur + 1);

            pager.append(prev, info, next);
        }

        /*------------ 返回详情 ------------*/
        async function renderDetail(box, item) {
            box.textContent = "";

            const fields = [
                ["类型",     item.type],
                ["物品名",   item.title],
                ["地点",     item.place],
                ["发生时间", item.happened_at],
                ["描述",     item.description],
                ["联系方式", item.contact_info],            // ★ 详情里才有
                ["状态",     STATUS_TEXT[item.status] || item.status],
                ["发布者",   item.publisher],
                ["发布时间", item.created_at],
            ];

            for (const [label, value] of fields){
                const p = document.createElement("p");
                p.textContent = label + "：" + (value || "—");
                box.appendChild(p);
            }
            const img = document.createElement("img");
            img.classList.add("big-image");
            img.src = "/uploads/" + item.image;
            img.onerror = () => { img.style.display = "none"; };
            box.appendChild(img);
        }

        /*------------ 显示详情 ------------*/
        async function toggleDetail(detail,id) {
            // 1.已经展开 -> 收起
            if (detail.style.display !== "none"){
                detail.style.display = "none";
                return;
            }
            // 2.没展开 -> 展开(第一次展开需要拿数据)
            if (!detail.dataset.loaded){
                detail.textContent = "加载中...";
                try{
                const res = await fetch ("/items/" + id);
                const data = await res.json();
                if(!res.ok){
                    detail.textContent = "加载失败：" + (data.msg || res.status); 
                    return; 
                }
                renderDetail(detail, data.data);            // ★ 用 createElement + textContent
                detail.dataset.loaded = 1;
                } catch(e) {
                detail.textContent = "请求失败：" + e.message;
                return;
                }
            }
            //3. 展开
            detail.style.display = "block";
        }

        async function _getUser(){
            try{
                const res = await fetch("/me",{
                    headers: { "Authorization": "Bearer " + token },
                });
                if(!res.ok){alert("请求失败"+res.status);return;}
                const data = await res.json();
                const user_name = data.data.username;
                const userId = data.data.user_id;
                alert("用户名:" + user_name + "\n" + "用户ID:" + userId)
                
            }catch(e){
                alert("请求失败：" + e.message)
            }
        }

        async function _del(id){
            if (!confirm("确定删除这条帖子吗？")) return;

            const token = localStorage.getItem("token");
            const out = $("out");
            if (!token) { out.textContent = "请先登录"; return; }

            try {
                const res = await fetch("/items/" + id, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token },
                });
                const data = await res.json();

                if (res.status === 401) {
                localStorage.clear(); ready();
                out.textContent = "登录已失效，请重新登录";
                return;
                }
                if (!res.ok) { out.textContent = "删除失败：" + (data.msg || res.status); return; }

                out.textContent = "删除成功 ✓";
                load(page);
            } catch (e) {
                out.textContent = "请求失败：" + e.message;
            }
        }

        /*---启动---*/
        ready();
        load(1);
    </script>
</body>
</html>
