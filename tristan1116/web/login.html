<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 校园失物招领系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="emoji">🔍</div>
      <h1>校园失物招领系统</h1>
      <p>让丢东西的人和捡到东西的人在这里相遇</p>
    </div>

    <div class="field">
      <label>用户名</label>
      <input class="input" id="username" autocomplete="username" placeholder="请输入用户名">
    </div>

    <div class="field">
      <label>密码</label>
      <input class="input" id="password" type="password" autocomplete="current-password"
        placeholder="请输入密码">
    </div>

    <button class="btn btn-primary" id="loginBtn">登 录</button>

    <div class="auth-footer">
      还没有账号？<a href="register.html">立即注册</a>
    </div>
    <div class="auth-footer">
      <a href="index.html" style="color:var(--text-sub)">先随便看看 →</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
