<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 失物招领</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page" style="max-width:480px;padding-top:36px">
  <div class="card">
    <h2 style="margin:0 0 16px;text-align:center">注册账号</h2>

    <div class="form-row" style="padding:6px 0">
      <div class="form-label" style="width:84px"><i>*</i>用户名</div>
      <div class="form-ctrl"><input id="username" type="text" maxlength="20" placeholder="4-20 位字母、数字或下划线"></div>
    </div>
    <div class="form-row" style="padding:6px 0">
      <div class="form-label" style="width:84px"><i>*</i>昵称</div>
      <div class="form-ctrl"><input id="nickname" type="text" maxlength="20" placeholder="2-20 个字符，展示给其他人"></div>
    </div>
    <div class="form-row" style="padding:6px 0">
      <div class="form-label" style="width:84px"><i>*</i>手机号</div>
      <div class="form-ctrl"><input id="phone" type="text" maxlength="11" placeholder="11 位手机号，用于联系方式"></div>
    </div>
    <div class="form-row" style="padding:6px 0">
      <div class="form-label" style="width:84px"><i>*</i>密码</div>
      <div class="form-ctrl">
        <input id="password" type="password" maxlength="20" placeholder="8-20 位，需同时包含字母和数字"
               oninput="checkStrength()">
        <div class="bar mt8" style="height:6px"><i id="strengthBar" style="width:0"></i></div>
        <div class="form-hint" id="strengthText">密码强度：未输入</div>
      </div>
    </div>
    <div class="form-row" style="padding:6px 0">
      <div class="form-label" style="width:84px"><i>*</i>确认密码</div>
      <div class="form-ctrl"><input id="confirm" type="password" maxlength="20" placeholder="再次输入密码"
             onkeydown="if(event.key==='Enter')doRegister()"></div>
    </div>
    <label class="muted" style="display:block;margin:10px 0 14px">
      <input type="checkbox" id="agree" checked> 我已阅读并同意平台使用条款与隐私说明
    </label>
    <button class="btn btn-primary btn-block" id="regBtn" onclick="doRegister()">注 册</button>
    <div class="muted" style="text-align:center;margin-top:14px">
      已有账号？<a href="login.html">直接登录</a>
    </div>
  </div>

  <div class="card">
    <b>注册说明</b>
    <div class="muted mt8">
      · 用户名与手机号全局唯一，注册后不可修改；<br>
      · 密码使用 PBKDF2-SHA256 加盐哈希存储，数据库中不保存明文；<br>
      · 手机号仅作为默认联系方式，展示时按登录状态脱敏。
    </div>
  </div>
</div>

<script src="static/app.js"></script>
<script>
  function checkStrength() {
    const v = el('password').value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Za-z]/.test(v) && /\d/.test(v)) score++;
    if (v.length >= 12 && /[^A-Za-z0-9]/.test(v)) score++;
    const map = [
      ['未输入', 0, 'var(--border)'], ['弱', 34, 'var(--danger)'],
      ['中', 67, 'var(--warning)'], ['强', 100, 'var(--success)'],
    ];
    const [text, width, color] = map[score];
    el('strengthBar').style.width = width + '%';
    el('strengthBar').style.background = color;
    el('strengthText').textContent = '密码强度：' + text;
  }

  async function doRegister() {
    const body = {
      username: el('username').value.trim(),
      nickname: el('nickname').value.trim(),
      phone: el('phone').value.trim(),
      password: el('password').value,
      confirmPassword: el('confirm').value,
    };
    if (!body.username || !body.nickname || !body.phone || !body.password) return toast('请完整填写注册信息', 'error');
    if (!/^[a-zA-Z0-9_]{4,20}$/.test(body.username)) return toast('用户名需为 4-20 位字母、数字或下划线', 'error');
    if (!/^1[3-9]\d{9}$/.test(body.phone)) return toast('手机号格式不正确', 'error');
    if (body.password !== body.confirmPassword) return toast('两次输入的密码不一致', 'error');
    if (!el('agree').checked) return toast('请先同意使用条款', 'error');

    const btn = el('regBtn');
    btn.disabled = true; btn.textContent = '注册中…';
    try {
      const d = await api('/auth/register', { method: 'POST', auth: false, body });
      Store.access = d.accessToken;
      Store.refresh = d.refreshToken;
      Store.user = d.user;
      toast('注册成功，已自动登录', 'success');
      setTimeout(() => location.href = 'index.html', 700);
    } catch (e) {
      btn.disabled = false; btn.textContent = '注 册';
    }
  }

  (async () => { await boot('register'); })();
</script>
</body>
</html>
