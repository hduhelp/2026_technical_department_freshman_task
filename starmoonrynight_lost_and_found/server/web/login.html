<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 失物招领</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page" style="max-width:430px;padding-top:44px">
  <div class="card">
    <h2 style="margin:0 0 4px;text-align:center">登录失物招领</h2>
    <div class="muted" style="text-align:center;margin-bottom:18px" id="tip">登录后可发布信息、查看完整联系方式</div>

    <div class="form-row" style="padding:6px 0">
      <div class="form-ctrl"><input id="acc" type="text" placeholder="用户名 / 手机号" autocomplete="username"></div>
    </div>
    <div class="form-row" style="padding:6px 0">
      <div class="form-ctrl"><input id="pwd" type="password" placeholder="密码" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()"></div>
    </div>
    <div class="flex-between" style="margin:6px 0 14px">
      <label class="muted"><input type="checkbox" id="remember" checked> 记住我</label>
      <a class="muted" href="javascript:toast('请联系管理员重置密码')">忘记密码？</a>
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="muted" style="text-align:center;margin-top:14px">
      还没有账号？<a href="register.html">立即注册</a>
    </div>
  </div>

  <div class="card">
    <b>演示账号（可用来自测）</b>
    <div class="muted mt8" style="line-height:2">
      管理员：<code>admin</code> / <code>Admin@123456</code>（可进入管理端与数据库管理台）<br>
      普通用户：<code>zhangsan</code> / <code>User@123456</code>（张三）<br>
      其他用户：<code>lisi</code>、<code>wangwu</code>、<code>zhaoliu</code>，密码同为 <code>User@123456</code><br>
      <span style="color:var(--danger)">正式上线前请立即修改管理员密码。</span>
    </div>
  </div>
</div>

<script src="static/app.js"></script>
<script>
  const redirect = qs('redirect');

  async function doLogin() {
    const account = el('acc').value.trim();
    const password = el('pwd').value;
    if (!account || !password) { toast('请输入账号和密码', 'error'); return; }
    const btn = el('loginBtn');
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const d = await api('/auth/login', { method: 'POST', auth: false, body: { account, password } });
      Store.access = d.accessToken;
      Store.refresh = d.refreshToken;
      Store.user = d.user;
      toast('登录成功', 'success');
      setTimeout(() => location.href = redirect || 'index.html', 500);
    } catch (e) {
      btn.disabled = false; btn.textContent = '登 录';
      el('pwd').value = '';
      el('pwd').focus();
    }
  }

  (async () => {
    await boot('login');
    if (redirect) el('tip').innerHTML = `请先登录，登录成功后自动返回：<b>${esc(redirect)}</b>`;
    if (Store.logged) { toast('你已登录', 'success'); setTimeout(() => location.href = redirect || 'index.html', 800); }
    el('acc').focus();
  })();
</script>
</body>
</html>
