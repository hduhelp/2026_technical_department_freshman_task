<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的发布 · 失物招领</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="page-title">个人中心</div>

  <div class="admin-layout">
    <div class="admin-menu">
      <a href="my-items.html" class="active">我的发布</a>
      <a href="my-claims.html">我的认领 <span id="menuUnread"></span></a>
      <a href="my-favorites.html">我的收藏</a>
      <a href="profile.html">资料维护</a>
      <a href="admin.html" id="adminEntry" style="display:none">管理后台</a>
      <a href="db.html" id="dbEntry" style="display:none">数据库管理台</a>
    </div>

    <div>
      <div class="card">
        <div class="flex-between">
          <div class="tabs" id="tabs" style="margin:0">
            <button class="active" data-status="">全部</button>
            <button data-status="1">发布中</button>
            <button data-status="2">已结束</button>
          </div>
          <a class="btn btn-sm btn-primary" href="publish.html">＋ 发布信息</a>
        </div>
      </div>
      <div id="list"></div>
      <div id="pager"></div>
    </div>
  </div>
</div>

<div class="footer">失物招领系统 v1.0</div>

<script src="static/app.js"></script>
<script>
  let state = { status: '', page: 1, size: 5 };
  let pages = 1;

  function itemBlock(it) {
    const claimPanel = it.type === 1 ? `
      <div id="claims-${it.id}" class="mt8" style="border-top:1px dashed var(--border);padding-top:10px">
        <span class="muted">正在加载认领信息…</span>
      </div>` : '';
    return `
    <div class="card">
      <div class="flex-between">
        <div class="row" style="gap:6px">
          ${tagHtml(it)}
        </div>
        <span class="muted">${fmtTime(it.createTime)}</span>
      </div>
      <h3 style="margin:10px 0 6px;font-size:15.5px">
        <a href="item.html?id=${it.id}">${esc(it.title)}</a>
      </h3>
      <div class="item-meta mb8">
        <span>📍 ${esc(it.locationText || '')}</span>
        <span>🕒 ${esc(it.happenTime)}</span>
        <span>浏览 ${it.viewCount}</span>
        <span>收藏 ${it.favoriteCount}</span>
      </div>
      <div class="row">
        <a class="btn btn-sm" href="publish.html?id=${it.id}">编辑</a>
        <button class="btn btn-sm btn-warning" onclick="toggleStatus(${it.id}, ${it.status})">
          ${it.status === 1 ? '标记已结束' : '重新上架'}</button>
        <button class="btn btn-sm btn-danger" onclick="removeItem(${it.id})">删除</button>
        <a class="btn btn-sm" href="item.html?id=${it.id}">查看详情</a>
      </div>
      ${claimPanel}
    </div>`;
  }

  async function loadClaims(itemId) {
    const box = el('claims-' + itemId);
    if (!box) return;
    try {
      const d = await api(`/items/${itemId}/claims`);
      if (!d.list.length) {
        box.innerHTML = `<span class="muted">暂未认领 · 有人提交认领申请后，这里会显示申请人列表与倒计时</span>`;
        return;
      }
      box.innerHTML = `
        <div class="flex-between mb8">
          <b>${d.list.length} 人认领中</b>
          <span class="muted">认领不排他，可根据物品特征选择其中一位</span>
        </div>
        ${d.list.map((c) => `
          <div class="list-line">
            <span><b>${esc(c.claimantName)}</b></span>
            <span class="muted">申请于 ${esc(c.startTime.slice(5, 16))} · 私聊 ${c.messageCount} 条</span>
            <span class="countdown ${c.remainHours <= 12 ? '' : 'warn'}">剩余 ${c.remainHours} 小时</span>
            <span class="row" style="gap:6px;margin-left:auto">
              <a class="btn btn-sm" href="item.html?id=${itemId}#chatCard">私聊</a>
              <button class="btn btn-sm btn-primary" onclick="finishClaim(${c.claimId}, ${itemId})">确认认领完成</button>
              <button class="btn btn-sm" onclick="releaseClaim(${c.claimId}, ${itemId})">解除认领</button>
            </span>
          </div>
          <div class="muted" style="padding:2px 0 8px 2px">认领说明：${esc(c.claimNote)}</div>`).join('')}
        <div class="muted mt8">规则：超过 ${SITE.claimTimeoutHours} 小时未沟通或未完成的认领，服务器会自动断开。</div>`;
    } catch (e) { box.innerHTML = ''; }
  }

  async function load() {
    renderSkeleton('list', 3);
    try {
      const p = new URLSearchParams({ page: state.page, size: state.size });
      if (state.status) p.set('status', state.status);
      const d = await api('/items/mine?' + p.toString());
      pages = d.pages;
      if (!d.list.length) {
        el('list').innerHTML = `<div class="card"><div class="empty">
            <div class="icon">📭</div><div>这里还没有信息</div>
            <div class="mt8"><a class="btn btn-sm btn-primary" href="publish.html">发布第一条信息</a></div></div></div>`;
      } else {
        el('list').innerHTML = d.list.map(itemBlock).join('');
        d.list.filter((i) => i.type === 1).forEach((i) => loadClaims(i.id));
      }
      el('pager').innerHTML = pagerHtml(d.page, d.pages, 'gotoPage');
    } catch (e) { /* ignore */ }
  }

  function gotoPage(p) { state.page = p; load(); }

  async function toggleStatus(id, current) {
    const target = current === 1 ? 2 : 1;
    if (target === 2 && !confirmBox('确认物品已找回 / 已归还？该信息将不再出现在检索结果中。')) return;
    await api(`/items/${id}/status`, { method: 'PATCH', body: { status: target } });
    toast(target === 2 ? '已标记结束' : '已重新上架', 'success');
    load();
  }

  async function removeItem(id) {
    if (!confirmBox('删除后不可恢复，确定删除这条信息吗？')) return;
    await api('/items/' + id, { method: 'DELETE' });
    toast('已删除', 'success');
    load();
  }

  async function finishClaim(claimId, itemId) {
    if (!confirmBox('确认物品已归还给该认领人？其他认领将同时断开。')) return;
    await api(`/claims/${claimId}/finish`, { method: 'PATCH', body: { note: '已当面核对并归还' } });
    toast('已确认认领完成，可把信息标记为已结束', 'success');
    load();
  }

  async function releaseClaim(claimId, itemId) {
    const reason = prompt('请输入解除原因：', '超过 72 小时未沟通');
    if (reason === null) return;
    if (!reason.trim()) { toast('原因不能为空', 'error'); return; }
    await api(`/claims/${claimId}/release`, { method: 'PATCH', body: { reason: reason.trim() } });
    toast('已解除该认领', 'success');
    load();
  }

  (async () => {
    await boot('center');
    if (!Store.logged) { location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname); return; }
    await loadSiteConfig();
    if (Store.user.role === 2) {
      el('adminEntry').style.display = 'block';
      el('dbEntry').style.display = 'block';
    }
    document.querySelectorAll('#tabs button').forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll('#tabs button').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        state.status = b.dataset.status;
        state.page = 1;
        load();
      };
    });
    await load();
  })();
</script>
</body>
</html>
