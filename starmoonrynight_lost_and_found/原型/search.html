<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检索结果 · 失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="page-title" id="summary">检索结果</div>

  <!-- 筛选栏：条件与 URL 同步，可分享 -->
  <div class="filter">
    <div class="filter-row">
      <span class="filter-label">类型</span>
      <span class="chip active" data-k="type" data-v="">全部</span>
      <span class="chip" data-k="type" data-v="1">失物</span>
      <span class="chip" data-k="type" data-v="2">招领</span>
    </div>
    <div class="filter-row">
      <span class="filter-label">分类</span>
      <span class="chip active" data-k="categoryId" data-v="">全部</span>
      <span id="catChips"></span>
    </div>
    <div class="filter-row">
      <span class="filter-label">地点</span>
      <span class="chip active" data-k="locArea" data-v="">全部</span>
      <span class="chip" data-k="locArea" data-v="campus">校内</span>
      <span class="chip" data-k="locArea" data-v="outside">校外</span>
      <select id="locSel" data-k="location" style="margin-left:8px">
        <option value="">详细地点不限</option>
      </select>
      <span class="filter-label" style="width:auto;margin-left:12px">排序</span>
      <select id="sortSel" data-k="sort">
        <option value="newest">最新发布</option>
        <option value="oldest">最早发布</option>
      </select>
      <span class="filter-label" style="width:auto;margin-left:12px">状态</span>
      <select id="statusSel" data-k="status">
        <option value="1">发布中</option>
        <option value="2">已结束</option>
        <option value="all">全部</option>
      </select>
      <button class="btn btn-sm" style="margin-left:auto" onclick="resetAll()">重置筛选</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">认领</span>
      <span class="chip active" data-k="claim" data-v="">全部</span>
      <span class="chip" data-k="claim" data-v="claiming">认领中</span>
      <span class="chip" data-k="claim" data-v="none">暂未认领</span>
      <span class="muted" style="margin-left:8px">仅对失物信息生效</span>
    </div>
  </div>

  <div class="grid-3" id="list"></div>

  <div class="flex-between mt16">
    <span class="muted" id="hint"></span>
    <span>
      <button class="btn btn-sm">‹ 上一页</button>
      <button class="btn btn-sm btn-primary">1</button>
      <button class="btn btn-sm">下一页 ›</button>
    </span>
  </div>
</div>

<div class="footer">失物招领系统 · 界面原型（演示数据，不连接后端）</div>

<script src="js/app.js"></script>
<script>
  renderNav('search');

  const state = {
    keyword: qs('keyword'),
    type: qs('type'),
    categoryId: qs('categoryId'),
    locArea: qs('locArea'),
    location: qs('location'),
    claim: qs('claim'),
    sort: qs('sort') || 'newest',
    status: qs('status') || '1'
  };

  // 初始化分类 chip
  document.getElementById('catChips').innerHTML = CATEGORIES
    .map((c) => `<span class="chip" data-k="categoryId" data-v="${c.id}">${c.name}</span>`).join('');
  const locSel = document.getElementById('locSel');

  // 详细地点下拉：随「校内 / 校外」切换
  function fillLocOptions() {
    const list = state.locArea === 'outside' ? OUTSIDE_LOCATIONS
      : state.locArea === 'campus' ? CAMPUS_LOCATIONS
        : CAMPUS_LOCATIONS.concat(OUTSIDE_LOCATIONS);
    locSel.innerHTML = '<option value="">详细地点不限</option>' +
      list.map((l) => `<option value="${l}">${l}</option>`).join('');
    locSel.value = list.includes(state.location) ? state.location : '';
    if (locSel.value === '') state.location = '';
  }

  document.getElementById('sortSel').value = state.sort;
  document.getElementById('statusSel').value = state.status;

  function markActive() {
    document.querySelectorAll('.chip').forEach((c) => {
      c.classList.toggle('active', (state[c.dataset.k] || '') === c.dataset.v);
    });
    locSel.value = state.location;
  }

  function render() {
    const list = queryItems(state);
    const kw = state.keyword;
    document.getElementById('summary').innerHTML = kw
      ? `共找到 <b>${list.length}</b> 条与「${esc(kw)}」相关的结果`
      : `全部信息（${list.length} 条）`;
    renderList(document.getElementById('list'), list, kw);
    document.getElementById('hint').textContent =
      `第 1 页 / 共 ${Math.max(list.length, 1)} 条 · 每页 12 条（原型不真实分页）`;
    markActive();
    // 条件同步到地址栏，便于分享
    const p = new URLSearchParams();
    Object.keys(state).forEach((k) => { if (state[k] && !(k === 'status' && state[k] === '1')) p.set(k, state[k]); });
    history.replaceState(null, '', 'search.html' + (p.toString() ? '?' + p : ''));
  }

  document.querySelectorAll('.chip').forEach((c) => {
    c.onclick = () => {
      state[c.dataset.k] = c.dataset.v;
      if (c.dataset.k === 'locArea') fillLocOptions();
      render();
    };
  });
  [['locSel', 'location'], ['sortSel', 'sort'], ['statusSel', 'status']].forEach(([id, key]) => {
    document.getElementById(id).onchange = (e) => { state[key] = e.target.value; render(); };
  });

  function resetAll() {
    Object.assign(state, { keyword: '', type: '', categoryId: '', locArea: '', location: '', claim: '', sort: 'newest', status: '1' });
    document.getElementById('sortSel').value = 'newest';
    document.getElementById('statusSel').value = '1';
    fillLocOptions();
    render();
  }

  // 顶部搜索框回填
  fillLocOptions();
  render();
  const navKw = document.getElementById('navKw');
  if (navKw) navKw.value = state.keyword;
</script>
</body>
</html>
