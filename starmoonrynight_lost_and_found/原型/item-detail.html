<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息详情 · 失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="muted mb8" id="crumb"></div>
  <div class="detail">

    <!-- 左侧：图片 + 正文 -->
    <div>
      <div class="card">
        <div class="gallery-main" id="main">暂无图片</div>
        <div class="gallery-thumbs" id="thumbs"></div>
      </div>

      <div class="card">
        <div class="row mb8" id="tags"></div>
        <h2 style="margin:6px 0 12px;font-size:20px" id="title"></h2>
        <div id="notice"></div>
        <div class="kv"><b>分类</b><span id="cat"></span></div>
        <div class="kv"><b>地点</b><span id="loc"></span></div>
        <div class="kv"><b>时间</b><span id="time"></span></div>
        <div class="kv kv-top" id="handoverRow" style="display:none"><b>上交地址</b><span id="handover" style="flex:1"></span></div>
        <div class="kv kv-top"><b>描述</b><span class="desc" id="desc" style="flex:1;margin-top:0"></span></div>
      </div>

      <!-- 失物认领：提交申请 + 站内私聊 -->
      <div class="card" id="claimBox" style="display:none">
        <div class="flex-between">
          <b>认领方式</b>
          <span id="claimTag"></span>
        </div>
        <div class="muted mt8" id="claimTip"></div>
        <div id="claimForm" class="mt8" style="display:none">
          <textarea id="claimNote" maxlength="200"
                    placeholder="请填写认领说明，例如：物品特征、丢失时间与地点、可提供的证明（如购买凭证、照片）"
                    style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;min-height:80px"></textarea>
          <div class="form-hint">提交后将生成一条认领申请，并自动开启与发布人的站内私聊；<b>72 小时内</b>未沟通或未完成认领，系统会自动断开你的认领。</div>
          <button class="btn btn-primary mt8" onclick="doClaim()">提交认领申请并开始私聊</button>
        </div>
        <div id="claimMine" class="mt8" style="display:none">
          <div class="notice" style="margin:0">
            你已提交认领申请，请在 <b class="countdown" id="cd"></b> 内与发布人沟通完成认领；超时未完成将自动断开。
          </div>
          <a class="btn btn-sm mt8" href="#chat">前往站内私聊 ↓</a>
        </div>
      </div>

      <!-- 站内私聊 -->
      <div class="card" id="chatCard" style="display:none">
        <div class="chat">
          <div class="chat-head">
            <b>站内私聊</b>
            <span class="muted" id="chatWith"></span>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <div class="chat-foot">
            <input id="chatInput" type="text" placeholder="输入消息，例如：我什么时候方便去取？"
                   onkeydown="if(event.key==='Enter')sendMsg()">
            <button class="btn btn-primary" onclick="sendMsg()">发送</button>
          </div>
        </div>
        <div class="row mt8">
          <button class="btn btn-sm btn-orange" onclick="doFinish()">确认认领完成</button>
          <span class="muted">确认完成后，发布人可把该信息标记为「已结束」。</span>
        </div>
      </div>

      <div class="card">
        <b>相关信息（同分类最新）</b>
        <div class="grid-3 mt8" id="related"></div>
      </div>
    </div>

    <!-- 右侧：联系方式与操作 -->
    <div>
      <div class="card">
        <b>联系方式</b>
        <div id="contact" class="mt8"></div>
      </div>

      <div class="card">
        <div class="flex-between">
          <div>
            <b id="publisher"></b>
            <div class="muted" id="pubMeta"></div>
          </div>
          <span class="tag tag-cat" id="statusTag"></span>
        </div>
        <div class="row mt16">
          <button class="btn btn-sm" id="favBtn" onclick="toggleFav()">收藏</button>
          <button class="btn btn-sm" onclick="toast('链接已复制，可分享给同学')">分享</button>
          <button class="btn btn-sm btn-danger" onclick="toast('已收到反馈，管理员会尽快处理')">举报</button>
        </div>
      </div>

      <!-- 仅本人可见的操作 -->
      <div class="card" id="ownerBox" style="display:none">
        <b>我的发布</b>
        <div class="muted mt8">你可以编辑、下架或删除这条信息。</div>
        <div class="row mt8">
          <a class="btn btn-sm" href="item-publish.html" id="editLink">编辑</a>
          <button class="btn btn-sm btn-warning" id="offBtn" onclick="toggleStatus()">标记已结束</button>
          <button class="btn btn-sm btn-danger" onclick="toast('已删除（原型仅演示提示）')">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">失物招领系统 · 界面原型（演示数据，不连接后端）</div>

<script src="js/app.js"></script>
<script>
  renderNav('detail');

  const id = Number(qs('id')) || 2001;
  const it = ITEMS.find((x) => x.id === id) || ITEMS[0];
  let favorited = favIds.has(it.id);

  function render() {
    document.getElementById('crumb').innerHTML =
      `<a href="index.html">首页</a> / <a href="search.html">全部信息</a> / ${it.type === 1 ? '失物' : '招领'} / ${esc(it.title)}`;
    document.getElementById('tags').innerHTML = typeTag(it) +
      `<span class="tag tag-cat">${catName(it.categoryId)}</span>` + statusTag(it) + claimTag(it) + anonTag(it);
    document.getElementById('title').textContent = it.title;
    document.getElementById('cat').textContent = catName(it.categoryId);
    document.getElementById('loc').textContent = locText(it);
    document.getElementById('time').textContent = it.happenTime;
    document.getElementById('desc').textContent = it.desc;
    document.getElementById('publisher').textContent = it.anonymous ? '匿名用户' : it.publisher;
    document.getElementById('pubMeta').innerHTML = `发布于 ${esc(it.time)} · 浏览 ${it.views} · 收藏 ${it.favs}`;
    document.getElementById('statusTag').textContent = it.status === 1 ? '发布中' : '已结束';
    document.getElementById('statusTag').className = 'tag ' + (it.status === 1 ? 'tag-found' : 'tag-end');

    // 上交地址（仅招领登记：拾获人把东西交到了哪里）
    const ho = document.getElementById('handoverRow');
    if (it.handover) {
      ho.style.display = 'flex';
      document.getElementById('handover').innerHTML =
        `${esc(it.handover)}${it.handoverPhone ? `　联系电话：<b>${store.logged ? esc(it.handoverPhone) : esc(it.handoverPhone.slice(0, 3) + '****' + it.handoverPhone.slice(7))}</b>` : ''}`;
    } else {
      ho.style.display = 'none';
    }

    // 图片区（原型用色块示意）
    const n = it.images;
    document.getElementById('main').textContent = n ? `图片 1 / ${n}（点击可放大）` : '暂无图片';
    document.getElementById('thumbs').innerHTML = n
      ? Array.from({ length: n }, (_, i) => `<div class="${i === 0 ? 'active' : ''}">图 ${i + 1}</div>`).join('')
      : '';
    document.querySelectorAll('.gallery-thumbs div').forEach((d, i) => {
      d.onclick = () => {
        document.querySelectorAll('.gallery-thumbs div').forEach((x) => x.classList.remove('active'));
        d.classList.add('active');
        document.getElementById('main').textContent = `图片 ${i + 1} / ${n}（点击可放大）`;
      };
    });

    // 已结束提示
    document.getElementById('notice').innerHTML = it.status === 2
      ? '<div class="notice">该信息已结束，物品已归还 / 找回，联系方式仍可查看，但请先确认是否仍需联系。</div>' : '';

    // 联系方式：匿名发布不展示个人联系方式；登记了上交地址时优先展示该地址的联系方式
    const box = document.getElementById('contact');
    if (it.anonymous) {
      box.innerHTML = `<div class="contact-box">
          <div class="kv"><b>发布人</b><span>匿名用户</span></div>
          <div class="kv"><b>说明</b><span>发布人选择匿名，前台不展示昵称与联系方式</span></div>
        </div>
        <div class="muted mt8">请通过下方「站内私聊」与发布人联系；平台后台保留实名信息，如遇纠纷可提交申诉由管理员介入。</div>`;
    } else if (it.handover) {
      box.innerHTML = `<div class="notice" style="margin:0 0 10px">拾获人已将该物品上交，请优先联系上交地址领取。</div>
        <div class="contact-box">
          <div class="kv"><b>上交地址</b><span>${esc(it.handover)}</span></div>
          ${it.handoverPhone ? `<div class="kv"><b>地址电话</b><span>${store.logged ? esc(it.handoverPhone) : esc(it.handoverPhone.slice(0, 3) + '****' + it.handoverPhone.slice(7))}</span></div>` : ''}
          <div class="kv"><b>发布人</b><span>${esc(it.publisher)}</span></div>
          <div class="kv"><b>发布人电话</b><span>${store.logged ? esc(it.phoneFull) : esc(it.phone)}</span></div>
        </div>`;
    } else if (store.logged) {
      box.innerHTML = `<div class="contact-box">
          <div class="kv"><b>联系人</b><span>${esc(it.publisher)}</span></div>
          <div class="kv"><b>电话</b><span>${esc(it.phoneFull)}</span></div>
          <div class="kv"><b>微信</b><span>${esc(it.wechat || '未填写')}</span></div>
        </div>
        <div class="muted mt8">提示：联系时请说明物品特征，避免冒领。</div>`;
    } else {
      box.innerHTML = `<div class="contact-box">
          <div class="kv"><b>联系人</b><span>${esc(it.publisher)}</span></div>
          <div class="kv"><b>电话</b><span>${esc(it.phone)}</span></div>
          <div class="kv"><b>微信</b><span>${it.wechat ? esc(it.wechat.replace(/(.{2}).+/, '$1***')) : '未填写'}</span></div>
        </div>
        <a class="btn btn-primary btn-block mt8" href="login.html?redirect=item-detail.html?id=${it.id}">登录后查看完整联系方式</a>`;
    }

    // 认领状态与认领入口（仅失物）
    const claimCount = activeClaims(it.id).length;
    document.getElementById('claimBox').style.display = it.type === 1 ? 'block' : 'none';
    document.getElementById('claimTag').innerHTML = claimCount > 0
      ? `<span class="tag tag-claiming">${claimCount} 人认领中</span>`
      : '<span class="tag tag-noclaim">暂未认领</span>';
    document.getElementById('claimTip').innerHTML = claimCount > 0
      ? `已有 <b>${claimCount}</b> 位同学提交认领申请，正在与发布人沟通。认领<b>不排他</b>：你仍可提交申请，由发布人根据物品特征自行判断；超过 72 小时未沟通或未完成的认领会被自动断开。`
      : '该失物暂无认领申请。若确认是你的物品，可提交认领申请并由平台开启站内私聊沟通。提交前请先准备好物品特征描述，便于发布人核对。';

    const mine = myClaim(it.id);
    document.getElementById('claimForm').style.display = (!mine && it.status === 1) ? 'block' : 'none';
    document.getElementById('claimMine').style.display = mine ? 'block' : 'none';
    if (mine) document.getElementById('cd').textContent = remainText(mine.deadline);

    // 站内私聊：我提交过认领，或我是发布人且有人认领
    const isOwner = store.logged;
    document.getElementById('chatCard').style.display = (mine || (isOwner && claimCount > 0)) ? 'block' : 'none';
    document.getElementById('chatWith').textContent = mine
      ? '与发布人沟通（匿名发布时仅显示昵称首字）'
      : (isOwner ? `有 ${claimCount} 位认领人，选择一位沟通并确认认领` : '');
    renderChat();

    // 收藏按钮
    document.getElementById('favBtn').textContent = favorited ? '★ 已收藏' : '☆ 收藏';

    // 本人操作区（原型：登录后即视为发布人）
    document.getElementById('ownerBox').style.display = store.logged ? 'block' : 'none';
    document.getElementById('ownerBox').querySelector('a.btn').href = 'item-publish.html?id=' + it.id;
    document.getElementById('editLink').href = 'item-publish.html?id=' + it.id;
    document.getElementById('offBtn').textContent = it.status === 1 ? '标记已结束' : '重新上架';

    // 相关信息
    const rel = ITEMS.filter((x) => x.id !== it.id && x.categoryId === it.categoryId).slice(0, 3);
    renderList(document.getElementById('related'), rel.length ? rel : ITEMS.filter((x) => x.id !== it.id).slice(0, 3), '');
  }

  function toggleFav() {
    if (!store.logged) { location.href = 'login.html?redirect=item-detail.html?id=' + it.id; return; }
    favorited = !favorited;
    favorited ? favIds.add(it.id) : favIds.delete(it.id);
    toast(favorited ? '已收藏，可在「我的收藏」中查看' : '已取消收藏');
    render();
  }

  function toggleStatus() {
    it.status = it.status === 1 ? 2 : 1;
    toast(it.status === 2 ? '已标记为结束，将不再出现在检索结果中' : '已重新上架');
    render();
  }

  /* ---------- 站内私聊（原型内存态） ---------- */
  const CHATS = {
    2002: [
      { who: '王五', me: true, text: '你好，这副耳机应该是我的，右耳壳有划痕，蓝色保护壳。', sys: false },
      { who: '李四', me: false, text: '收到，请再说一下你丢的时间？', sys: false },
      { who: '王五', me: true, text: '6 月 10 日晚上打球的时候，大概 18:00 左右。', sys: false },
      { who: '系统', me: false, text: '提示：认领申请需在 72 小时内沟通并完成，超时将自动断开。', sys: true }
    ]
  };
  function chatList() {
    if (!CHATS[it.id]) CHATS[it.id] = [
      { who: '系统', me: false, text: `认领申请已提交，请在 ${CLAIM_TIMEOUT_HOURS} 小时内沟通完成认领。`, sys: true }
    ];
    return CHATS[it.id];
  }
  function renderChat() {
    const body = document.getElementById('chatBody');
    body.innerHTML = chatList().map((m) => m.sys
      ? `<div class="msg sys"><div class="bubble">${esc(m.text)}</div></div>`
      : `<div class="msg ${m.me ? 'me' : ''}"><div class="who">${esc(m.who)}</div><div class="bubble">${esc(m.text)}</div></div>`
    ).join('');
    body.scrollTop = body.scrollHeight;
  }
  function sendMsg() {
    const input = document.getElementById('chatInput');
    const v = input.value.trim();
    if (!v) return;
    chatList().push({ who: store.name, me: true, text: v, sys: false });
    input.value = '';
    renderChat();
    setTimeout(() => {
      chatList().push({ who: it.anonymous ? '匿名用户' : it.publisher, me: false, text: '收到，我们再约个时间当面核对物品特征。', sys: false });
      renderChat();
    }, 700);
  }
  function doClaim() {
    const note = document.getElementById('claimNote').value.trim();
    if (note.length < 10) { toast('请至少填写 10 个字的认领说明，便于发布人核对'); return; }
    if (submitClaim(it.id, note)) render();
  }
  function doFinish() {
    finishClaim(it.id);
    it.status = 2;
    render();
  }

  render();
</script>
</body>
</html>
