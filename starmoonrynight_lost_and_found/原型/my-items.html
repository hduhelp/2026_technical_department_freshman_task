<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的发布 · 失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="page-title">个人中心</div>

  <div class="grid-2" style="grid-template-columns:220px 1fr;align-items:start">
    <!-- 左侧菜单 -->
    <div class="card" style="padding:12px">
      <div class="list-line"><b>我的发布</b></div>
      <div class="list-line"><a href="javascript:toast('我的收藏：展示已收藏的信息列表')">我的收藏</a></div>
      <div class="list-line"><a href="javascript:toast('资料维护：昵称 / 微信 / 头像 / 修改密码')">资料维护</a></div>
      <div class="list-line"><a href="admin.html">进入管理端</a></div>
    </div>

    <!-- 右侧内容 -->
    <div>
      <div class="card">
        <div class="flex-between">
          <div class="tabs" style="margin:0">
            <button class="active" data-st="all">全部</button>
            <button data-st="1">发布中</button>
            <button data-st="2">已结束</button>
          </div>
          <a class="btn btn-sm btn-primary" href="item-publish.html">＋ 发布信息</a>
        </div>
      </div>

      <div id="mine"></div>
    </div>
  </div>
</div>

<div class="footer">失物招领系统 · 界面原型（演示数据，不连接后端）</div>

<script src="js/app.js"></script>
<script>
  renderNav('mine');
  // 原型说明：正式系统未登录会跳登录页；此处为便于直接预览不做拦截，仅给出提示
  if (!store.logged) {
    toast('未登录：正式系统会先跳转登录页，原型为便于预览直接放行');
  }

  // 原型：把前 4 条当作「我的发布」
  const mine = ITEMS.slice(0, 4);
  const box = document.getElementById('mine');

  function render(st) {
    const list = st === 'all' ? mine : mine.filter((i) => i.status === Number(st));
    if (!list.length) {
      box.innerHTML = `<div class="card"><div class="empty"><div class="icon">📭</div>这里还没有信息</div></div>`;
      return;
    }
    box.innerHTML = list.map((it) => `
      <div class="card">
        <div class="flex-between">
          <div class="row" style="gap:6px">
            ${typeTag(it)}<span class="tag tag-cat">${catName(it.categoryId)}</span>
            <span class="tag ${it.status === 1 ? 'tag-found' : 'tag-end'}">${it.status === 1 ? '发布中' : '已结束'}</span>
            ${claimTag(it)}${anonTag(it)}
          </div>
          <span class="muted">${esc(it.time)}</span>
        </div>
        <h3 style="margin:10px 0 6px;font-size:15.5px">${esc(it.title)}</h3>
        <div class="item-meta mb8">
          <span>📍 ${esc(locText(it))}</span><span>🕒 ${esc(it.happenTime)}</span>
          <span>浏览 ${it.views}</span><span>收藏 ${it.favs}</span>
        </div>
        <div class="row">
          <a class="btn btn-sm" href="item-publish.html?id=${it.id}">编辑</a>
          <button class="btn btn-sm btn-warning" onclick="changeStatus(${it.id})">${it.status === 1 ? '标记已结束' : '重新上架'}</button>
          <button class="btn btn-sm btn-danger" onclick="removeItem(${it.id})">删除</button>
          <a class="btn btn-sm" href="item-detail.html?id=${it.id}">查看详情</a>
        </div>
        ${it.type === 1 ? claimPanel(it) : ''}
      </div>`).join('');
  }

  /* 失物：认领管理面板 */
  function claimPanel(it) {
    const list = activeClaims(it.id);
    if (!list.length) {
      return `<div class="muted mt8" style="border-top:1px dashed var(--border);padding-top:10px">
        暂未认领 · 有人提交认领申请后，这里会显示申请人列表与倒计时。</div>`;
    }
    return `<div style="border-top:1px dashed var(--border);margin-top:10px;padding-top:10px">
      <div class="flex-between mb8">
        <b>${list.length} 人认领中</b>
        <span class="muted">认领不排他，你可以根据物品特征选择其中一位</span>
      </div>
      ${list.map((c) => `<div class="list-line">
          <span>${esc(c.name)}</span>
          <span class="muted">申请于 ${esc(c.time)} · 私聊 ${c.messages} 条</span>
          <span class="countdown">剩余 ${remainText(c.deadline)}</span>
          <span class="row" style="gap:6px;margin-left:auto">
            <a class="btn btn-sm" href="item-detail.html?id=${it.id}#chat">私聊</a>
            <button class="btn btn-sm btn-primary" onclick="confirmClaim(${c.id})">确认认领完成</button>
            <button class="btn btn-sm" onclick="releaseClaim(${c.id})">解除认领</button>
          </span>
        </div>`).join('')}
      <div class="muted mt8">规则：超过 72 小时未沟通或未完成的认领，系统会自动断开（也可由发布人手动解除）。</div>
    </div>`;
  }

  function confirmClaim(claimId) {
    const c = CLAIMS.find((x) => x.id === claimId);
    c.status = 'done';
    toast('已确认该同学认领完成，可把信息标记为「已结束」');
    rerender();
  }

  function releaseClaim(claimId) {
    if (!confirm('解除后该同学需要重新提交认领申请，确定解除吗？')) return;
    const c = CLAIMS.find((x) => x.id === claimId);
    c.status = 'expired';
    toast('已解除该认领（原因：超时或协商未达成）');
    rerender();
  }

  function rerender() {
    document.querySelectorAll('.tabs button').forEach((b) => {
      if (b.classList.contains('active')) render(b.dataset.st);
    });
  }

  function changeStatus(id) {
    const it = mine.find((x) => x.id === id);
    it.status = it.status === 1 ? 2 : 1;
    toast(it.status === 2 ? '已标记结束，该信息不再出现在检索结果中' : '已重新上架');
    rerender();
  }

  function removeItem(id) {
    if (!confirm('删除后不可恢复，确定删除这条信息吗？')) return;
    const i = mine.findIndex((x) => x.id === id);
    mine.splice(i, 1);
    toast('已删除');
    rerender();
  }

  document.querySelectorAll('.tabs button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      render(b.dataset.st);
    };
  });

  render('all');
</script>
</body>
</html>
