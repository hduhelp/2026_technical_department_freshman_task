<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page" style="max-width:420px;padding-top:48px">
  <div class="card">
    <h2 style="margin:0 0 4px;text-align:center">登录失物招领</h2>
    <div class="muted" style="text-align:center;margin-bottom:20px">登录后可发布信息、查看完整联系方式</div>

    <div class="form-row" style="flex-direction:column">
      <div class="form-ctrl" style="width:100%">
        <input id="acc" type="text" placeholder="用户名 / 手机号" style="width:100%">
      </div>
    </div>
    <div class="form-row" style="flex-direction:column">
      <div class="form-ctrl" style="width:100%">
        <input id="pwd" type="password" placeholder="密码（演示：任意非空即可）" style="width:100%"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>

    <div class="flex-between" style="margin:4px 0 14px">
      <label class="muted"><input type="checkbox" id="remember" checked> 记住我</label>
      <a class="muted" href="javascript:toast('请联系管理员重置密码')">忘记密码？</a>
    </div>

    <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
    <div class="muted" style="text-align:center;margin-top:14px">
      还没有账号？<a href="javascript:toast('注册页原型略，字段为：用户名 / 昵称 / 手机号 / 密码')">立即注册</a>
    </div>
  </div>

  <div class="card">
    <b>登录相关规则</b>
    <div class="muted mt8">
      · 5 分钟内连续 5 次密码错误，账号锁定 15 分钟；<br>
      · 被禁用的账号无法登录，已登录的令牌立即失效；<br>
      · 登录成功后签发访问令牌（2 小时）与刷新令牌（7 天）；<br>
      · 未登录点击「查看联系方式」会先跳到本页，登录后自动回到原页面。
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  renderNav('login');
  const redirect = qs('redirect');
  if (redirect) {
    document.querySelector('.muted').innerHTML =
      `请先登录，登录成功后自动返回：<b>${esc(redirect)}</b>`;
  }

  function doLogin() {
    const acc = document.getElementById('acc').value.trim();
    const pwd = document.getElementById('pwd').value;
    if (!acc || !pwd) { toast('请输入账号和密码'); return; }
    store.logged = true;
    store.name = '张三';
    toast('登录成功');
    setTimeout(() => location.href = redirect || 'index.html', 700);
  }
</script>
</body>
</html>
