<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · 失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="page">

  <!-- ① 搜索区 -->
  <div class="hero">
    <h1>丢了东西？捡到东西？</h1>
    <p>1 分钟发布信息，1 秒找到线索</p>
    <div class="hero-search">
      <input id="kw" type="text" placeholder="搜索物品名称、特征物、地点，例如：雨伞 / 校园卡 / 蓝牙耳机"
             onkeydown="if(event.key==='Enter')goSearch()">
      <button onclick="goSearch()">搜索</button>
    </div>
    <div class="hot">
      <b>热门：</b>
      <a href="search.html?keyword=校园卡">校园卡</a>
      <a href="search.html?keyword=雨伞">雨伞</a>
      <a href="search.html?keyword=耳机">耳机</a>
      <a href="search.html?keyword=钥匙">钥匙</a>
      <a href="search.html?keyword=保温杯">保温杯</a>
    </div>
  </div>

  <!-- ② 分类快捷入口 -->
  <div class="card">
    <div class="flex-between mb8">
      <b>按分类查找</b>
      <span class="muted">共 8 条示例信息</span>
    </div>
    <div class="cat-nav" id="cats"></div>
  </div>

  <!-- ③ 最新发布 -->
  <div class="section-head">
    <h2>最新发布</h2>
    <div class="tabs" id="tabs">
      <button class="active" data-type="">全部</button>
      <button data-type="1">失物</button>
      <button data-type="2">招领</button>
    </div>
  </div>
  <div class="grid-3" id="list"></div>

  <!-- ④ 找回成果 + 平台数据 -->
  <div class="grid-2 mt16">
    <div class="card">
      <b>最近物归原主</b>
      <div class="list-line"><span class="tag tag-found">招领</span> 校园卡已归还失主 <span class="muted" style="margin-left:auto">2 小时前</span></div>
      <div class="list-line"><span class="tag tag-lost">失物</span> 蓝色折叠伞已找回 <span class="muted" style="margin-left:auto">昨天</span></div>
      <div class="list-line"><span class="tag tag-found">招领</span> 一串钥匙已认领 <span class="muted" style="margin-left:auto">3 天前</span></div>
    </div>
    <div class="card">
      <b>平台数据</b>
      <div class="row mt8">
        <div class="stat" style="flex:1"><div class="num">1,024</div><div class="lbl">累计物归原主</div></div>
        <div class="stat" style="flex:1"><div class="num">8</div><div class="lbl">在架信息（示例）</div></div>
        <div class="stat" style="flex:1"><div class="num">90%</div><div class="lbl">信息有效率</div></div>
      </div>
      <div class="muted mt8">仅统计「发布中」状态的信息，已结束信息自动不再展示。</div>
    </div>
  </div>
</div>

<div class="footer">失物招领系统 · 界面原型（演示数据，不连接后端）　|　关于我们 · 免责声明 · 联系方式</div>

<script src="js/app.js"></script>
<script>
  renderNav('home');

  // 分类入口
  document.getElementById('cats').innerHTML = CATEGORIES
    .map((c) => `<a href="search.html?categoryId=${c.id}">${c.name}</a>`).join('');

  // 最新发布 + 类型切换
  const listEl = document.getElementById('list');
  function refresh(type) {
    let list = ITEMS.filter((i) => i.status === 1);
    if (type) list = list.filter((i) => i.type === Number(type));
    renderList(listEl, list.slice(0, 6));
  }
  refresh('');
  document.querySelectorAll('#tabs button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('#tabs button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      refresh(b.dataset.type);
    };
  });
</script>
</body>
</html>
